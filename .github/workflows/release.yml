name: Release

# Manual only, on purpose: releasing is a deliberate act, not a side effect of
# every push (ci.yml already runs build/test/clippy on every push to main —
# this workflow is the separate "cut a release" button). To ship one: Actions
# tab → Release → Run workflow → pick patch/minor/major. `bump-version` reads
# the current version straight out of Cargo.toml, bumps it, commits and
# pushes that, and the build/release jobs run against the bumped commit —
# no local edit needed.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Bump the ${{ inputs.bump }} version and push
        id: bump
        run: |
          set -euo pipefail
          current=$(awk -F'"' '/^\[workspace\.package\]/{f=1} f && /^version *=/{print $2; exit}' Cargo.toml)
          if [ -z "$current" ]; then
            echo "::error::couldn't read workspace.package.version from Cargo.toml"
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="${major}.$((minor + 1)).0" ;;
            patch) next="${major}.${minor}.$((patch + 1))" ;;
          esac

          sed -i "0,/^version = \".*\"/s//version = \"${next}\"/" Cargo.toml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v${next}"
          git push

          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: bump-version
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners only — no cross-compilation. russh pulls aws-lc-sys,
          # a cmake-built C library whose cross and musl stories are both
          # unpleasant; building on the matching host sidesteps all of it.
          #
          # ubuntu-22.04 rather than -latest on purpose: it sets the glibc
          # floor for the x86_64 binary, and a newer runner would exclude
          # distros that a 22.04 build happily runs on.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The release profile uses full LTO with codegen-units = 1. It's slow
      # (~10 min on the crypto-heavy dependency tree) but it's CI's CPU, and
      # this is the binary users actually download.
      - name: Build
        run: cargo build --release -p emuhub-tui --bin emuhub

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.bump-version.outputs.version }}"
          name="emuhub-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp target/release/emuhub "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  release:
    needs: [bump-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Creates the vX.Y.Z tag as part of creating the release, pinned to the
      # bump commit (not just "whatever main is now") in case another push
      # lands while the build matrix is running.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.bump-version.outputs.version }}"
          gh release create "v${version}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "v${version}" \
            --target "${{ needs.bump-version.outputs.sha }}" \
            --generate-notes \
            dist/*.tar.gz dist/*.sha256
